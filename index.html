<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adivinhe o Número</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1>Adivinhe o Número</h1>
    <p class="subtitle">Pense em um número de 1 a 30. Você tem 5 tentativas!</p>

    <div class="input-group">
      <input type="number" id="palpite" min="1" max="30" placeholder="?" aria-label="Seu palpite" autofocus>
      <button id="btn-chutar">Chutar</button>
    </div>

    <p class="message" id="mensagem" aria-live="polite"></p>

    <div class="progress"><div id="barra"></div></div>

    <div class="stats">
      <div class="stat"><span>Tentativas</span><strong id="tentativas">0</strong></div>
      <div class="stat"><span>Restantes</span><strong id="restantes">10</strong></div>
    </div>

    <ul class="history" id="historico"></ul>

    <button class="secondary" id="btn-reiniciar" style="margin-top: 1.25rem;">Novo jogo</button>
  </main>

  <script>
    const MIN = 1;
    const MAX = 30;
    const MAX_TENTATIVAS = 5;

    const campo = document.getElementById("palpite");
    const btnChutar = document.getElementById("btn-chutar");
    const btnReiniciar = document.getElementById("btn-reiniciar");
    const mensagem = document.getElementById("mensagem");
    const barra = document.getElementById("barra");
    const elTentativas = document.getElementById("tentativas");
    const elRestantes = document.getElementById("restantes");
    const historico = document.getElementById("historico");
    const card = document.querySelector(".game");

    let secreto, tentativas, acabou;

    function sortear() {
      return Math.floor(Math.random() * (MAX - MIN + 1)) + MIN;
    }

    function mostrar(texto, classe) {
      mensagem.textContent = texto;
      mensagem.className = "message " + (classe || "");
    }

    function atualizarPainel() {
      const restantes = MAX_TENTATIVAS - tentativas;
      elTentativas.textContent = tentativas;
      elRestantes.textContent = restantes;
      barra.style.width = (restantes / MAX_TENTATIVAS) * 100 + "%";
    }

    function tremer() {
      card.classList.remove("shake");
      void card.offsetWidth; // reinicia a animação
      card.classList.add("shake");
    }

    function terminar() {
      acabou = true;
      campo.disabled = true;
      btnChutar.disabled = true;
    }

    function novoJogo() {
      secreto = sortear();
      tentativas = 0;
      acabou = false;
      historico.innerHTML = "";
      campo.disabled = false;
      btnChutar.disabled = false;
      campo.value = "";
      campo.focus();
      mostrar("Faça seu primeiro palpite!");
      atualizarPainel();
    }

    function chutar() {
      if (acabou) return;

      const valor = Number(campo.value);
      if (!campo.value || !Number.isInteger(valor) || valor < MIN || valor > MAX) {
        mostrar(`Digite um número inteiro entre ${MIN} e ${MAX}.`, "lose");
        tremer();
        return;
      }

      tentativas++;
      const chip = document.createElement("li");
      chip.textContent = valor;
      historico.appendChild(chip);

      if (valor === secreto) {
        mostrar(`🎉 Acertou! O número era ${secreto}, em ${tentativas} tentativa(s).`, "win");
        terminar();
      } else if (tentativas >= MAX_TENTATIVAS) {
        mostrar(`😢 Fim de jogo! O número era ${secreto}.`, "lose");
        terminar();
        tremer();
      } else if (valor > secreto) {
        mostrar("Muito alto! Tente um número menor. ⬇️", "high");
        tremer();
      } else {
        mostrar("Muito baixo! Tente um número maior. ⬆️", "low");
        tremer();
      }

      atualizarPainel();
      campo.value = "";
      if (!acabou) campo.focus();
    }

    btnChutar.addEventListener("click", chutar);
    btnReiniciar.addEventListener("click", novoJogo);
    campo.addEventListener("keydown", (e) => {
      if (e.key === "Enter") chutar();
    });

    novoJogo();
  </script>
</body>
</html>
